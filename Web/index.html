<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="vendor/marked.js"></script>
  <script src="vendor/purify.js"></script>
  <script src="vendor/turndown.js"></script>
  <script src="vendor/turndown-gfm.js"></script>
  <script src="vendor/mermaid.min.js"></script>
</head>
<body>
  <div id="app-shell">
    <header id="topbar">
      <div class="identity">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="identity-copy">
          <span class="brand-name">MARKDOWNDESK</span>
          <span id="filename">Untitled.md</span>
        </div>
      </div>
      <div class="file-actions" aria-label="File actions">
        <button id="new-file" class="quiet-action" title="New Markdown file (⌘N)">New <span class="shortcut">⌘N</span></button>
        <button id="open-file" class="quiet-action" title="Open a Markdown file (⌘O)">Open <span class="shortcut">⌘O</span></button>
        <button id="save-file" class="primary-action" title="Save Markdown (⌘S)">Save <span class="shortcut">⌘S</span></button>
      </div>
    </header>
    <div id="toolbar" role="toolbar" aria-label="Formatting">
      <div class="tool-group style-group">
        <label for="block-style">STYLE</label>
        <select id="block-style" title="Paragraph style">
          <option value="paragraph">Body text</option>
          <option value="h1">Heading 1</option>
          <option value="h2">Heading 2</option>
          <option value="h3">Heading 3</option>
        </select>
      </div>
      <div class="tool-divider" aria-hidden="true"></div>
      <div class="tool-group emphasis-group">
        <button class="tool-button type-button" data-action="bold" title="Bold (⌘B)" aria-label="Bold"><strong>B</strong></button>
        <button class="tool-button type-button" data-action="italic" title="Italic (⌘I)" aria-label="Italic"><em>I</em></button>
      </div>
      <div class="tool-divider" aria-hidden="true"></div>
      <div class="tool-group block-group">
        <button class="tool-button" data-action="unordered" title="Bulleted list">Bullets</button>
        <button class="tool-button" data-action="ordered" title="Numbered list">Numbers</button>
        <button class="tool-button" data-action="quote" title="Block quote">Quote</button>
        <button class="tool-button" data-action="code" title="Code block">Code</button>
        <button class="tool-button" data-action="link" title="Insert link">Link</button>
      </div>
      <div class="toolbar-spacer"></div>
      <button id="mode" class="mode-button" title="Switch between rich text and Markdown source (⌘⇧M)">Source <span class="mode-glyph" aria-hidden="true">⌘⇧M</span></button>
    </div>
    <main id="workspace">
      <div id="paper">
        <div class="paper-header" aria-hidden="true"><span>DOCUMENT</span><span class="paper-rule"></span><span>MD</span></div>
        <article id="editor" contenteditable="true" spellcheck="true" aria-label="Document"></article>
        <textarea id="source" spellcheck="false" aria-label="Markdown source"></textarea>
      </div>
    </main>
    <footer id="status"><span id="view-label">RICH TEXT</span><span id="wordcount">0 words</span></footer>
  </div>
  <script src="editor.js"></script>
</body>
</html>
