name: macOS installer
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  installer:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The packaging script builds, tests, creates the DMG, and verifies it.
      - run: npm run dmg
      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownDesk-macos-unsigned
          path: dist/*-local-unsigned.dmg
          if-no-files-found: error
          retention-days: 14
